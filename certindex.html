<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Download</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #202124;
            background:
                radial-gradient(circle at top left, rgba(20, 143, 83, 0.14), transparent 34%),
                radial-gradient(circle at bottom right, rgba(0, 158, 214, 0.14), transparent 36%),
                #f6f8fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border: 1px solid rgba(20, 143, 83, 0.18);
            border-radius: 8px;
            box-shadow: 0 18px 46px rgba(31, 41, 55, 0.14);
            padding: 32px;
        }

        .brand {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-frame {
            width: min(100%, 360px);
            background: #fff;
            border: 1px solid #e4edf0;
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(31, 41, 55, 0.08);
            padding: 14px 18px;
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
            text-align: center;
        }

        p {
            margin: 0 0 24px;
            color: #5f6368;
            line-height: 1.5;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .field-wrap {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            border: 1px solid #c9d1d9;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            border-color: #148f53;
            box-shadow: 0 0 0 3px rgba(20, 143, 83, 0.16);
            outline: none;
        }

        button,
        .download-link {
            min-height: 44px;
            border: 0;
            border-radius: 6px;
            background: #148f53;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            padding: 10px 18px;
            text-decoration: none;
        }

        button {
            width: 100%;
            margin-top: 16px;
        }

        button:hover,
        .download-link:hover {
            background: #0f6f41;
        }

        button:disabled {
            background: #aeb7c2;
            cursor: not-allowed;
        }

        .status {
            min-height: 24px;
            margin-top: 16px;
            color: #5f6368;
            line-height: 1.45;
        }

        .status.error {
            color: #b3261e;
        }

        .status.success {
            color: #137333;
        }

        .results {
            display: grid;
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
            margin: 10px 0 0;
        }

        .result {
            background: #f8faf9;
            border: 1px solid #dfe8e2;
            border-radius: 6px;
            color: #202124;
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .result:hover {
            background: #eaf6ef;
            border-color: #b8dcc6;
        }

        .result-name {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #202124;
            cursor: pointer;
            font-weight: 700;
        }

        .result.empty {
            color: #6f7782;
            cursor: default;
            font-weight: 400;
        }

        .result.empty:hover {
            background: #fff;
            color: #6f7782;
        }

        .download-link {
            flex: 0 0 auto;
            min-height: 36px;
            padding: 8px 12px;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            main {
                padding: 24px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .result {
                align-items: stretch;
                flex-direction: column;
            }

            .download-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <div class="logo-frame">
                <img class="logo" src="nnc_logo.jpg" alt="NNC">
            </div>
        </div>
        <h1>Certificate Download</h1>
        <p id="folderNote">Enter your name exactly as used on the certificate.</p>

        <form id="lookupForm">
            <label for="personName">Name</label>
            <div class="field-wrap">
                <input id="personName" name="personName" type="text" placeholder="Example: Mitesh Budhabhatti" autocomplete="off" list="nameSuggestions" aria-autocomplete="list" aria-controls="results" required>
                <datalist id="nameSuggestions"></datalist>
            </div>
            <div id="results" class="results" role="listbox" hidden></div>
            <button id="downloadButton" type="submit">Download PDF</button>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const folder = cleanFolder(params.get('folder') || params.get('dir') || params.get('path') || '');
        const form = document.getElementById('lookupForm');
        const input = document.getElementById('personName');
        const statusBox = document.getElementById('status');
        const resultsBox = document.getElementById('results');
        const suggestions = document.getElementById('nameSuggestions');
        const downloadButton = document.getElementById('downloadButton');
        const folderNote = document.getElementById('folderNote');
        const defaultGitHubRepo = 'mitesh1112/mitesh1112.github.io';
        let certificates = [];
        let isLoadingNames = false;

        if (!folder) {
            downloadButton.disabled = true;
            setStatus('Please pass the certificate folder in the URL, for example: certindex.html?folder=nvnsaputara2026', 'error');
        } else {
            folderNote.textContent = 'Event - ' + folder;
            loadCertificateNames();
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const name = normalizeSpaces(input.value);

            if (!folder || !name) {
                return;
            }

            setStatus('Checking certificate...', '');
            resultsBox.innerHTML = '';

            const directMatch = await findDirectPdf(name);
            if (directMatch) {
                downloadPdf(directMatch.url, directMatch.fileName);
                setStatus('Certificate found. Your download should start now.', 'success');
                return;
            }

            const match = findExactIndexMatch(name);
            if (match && await fileExists(match.url)) {
                downloadPdf(match.url, match.fileName);
                setStatus('Certificate found. Your download should start now.', 'success');
                return;
            }

            setStatus('Certificate not found. Please check the spelling and try again.', 'error');
        });

        input.addEventListener('input', function () {
            renderMatches(normalizeSpaces(input.value));
        });

        input.addEventListener('focus', function () {
            renderMatches(normalizeSpaces(input.value));
        });

        document.addEventListener('click', function (event) {
            if (!event.target.closest('#lookupForm')) {
                hideMatches();
            }
        });

        async function loadCertificateNames() {
            const repoInfo = getGitHubRepoInfo();

            if (!repoInfo.owner || !repoInfo.repo) {
                setStatus('Enter your full name to download. Autocomplete could not determine the GitHub repository.', '');
                return;
            }

            isLoadingNames = true;
            setStatus('Loading certificate names...', '');

            try {
                const branch = await getDefaultBranch(repoInfo);
                const files = await fetchPdfFiles(repoInfo, branch);
                certificates = files.map(function (fileName) {
                    return createCertificate(stripPdfExtension(fileName), fileName);
                }).filter(Boolean).sort(sortByNameDescending);

                if (certificates.length === 0) {
                    setStatus('No PDF files were found in this folder. Please check the folder name in the URL.', 'error');
                    return;
                }

                populateNameSuggestions();
                setStatus('Type your name to search matching certificates.', '');
            } catch (error) {
                console.warn('Could not load PDF names from GitHub:', error);
                setStatus('Enter your full name to download. Autocomplete could not load the folder file list.', '');
            } finally {
                isLoadingNames = false;
                renderMatches(normalizeSpaces(input.value));
            }
        }

        async function getDefaultBranch(repoInfo) {
            if (params.get('branch')) {
                return params.get('branch');
            }

            const response = await fetch(getGitHubRepoApiUrl(repoInfo), { cache: 'no-store' });
            if (!response.ok) {
                return 'main';
            }

            const repo = await response.json();
            return repo.default_branch || 'main';
        }

        async function fetchPdfFiles(repoInfo, branch) {
            const contentFiles = await fetchPdfFilesFromContents(repoInfo, branch);
            if (contentFiles.length > 0) {
                return contentFiles;
            }

            return fetchPdfFilesFromTree(repoInfo, branch);
        }

        async function fetchPdfFilesFromContents(repoInfo, branch) {
            const response = await fetch(getGitHubContentsApiUrl(repoInfo, branch), { cache: 'no-store' });
            if (!response.ok) {
                return [];
            }

            const files = await response.json();
            if (!Array.isArray(files)) {
                return [];
            }

            return files
                .filter(function (file) {
                    return file.type === 'file' && /\.pdf$/i.test(file.name);
                })
                .map(function (file) {
                    return file.name;
                });
        }

        async function fetchPdfFilesFromTree(repoInfo, branch) {
            const response = await fetch(getGitHubTreeApiUrl(repoInfo, branch), { cache: 'no-store' });
            if (!response.ok) {
                return [];
            }

            const data = await response.json();
            if (!Array.isArray(data.tree)) {
                return [];
            }

            const folderPrefix = folder.replace(/\/+$/g, '') + '/';
            return data.tree
                .filter(function (item) {
                    return item.type === 'blob' &&
                        item.path.indexOf(folderPrefix) === 0 &&
                        item.path.slice(folderPrefix.length).indexOf('/') === -1 &&
                        /\.pdf$/i.test(item.path);
                })
                .map(function (item) {
                    return item.path.slice(folderPrefix.length);
                });
        }

        function createCertificate(name, fileName) {
            if (!name || !fileName) {
                return null;
            }

            return {
                name: normalizeSpaces(stripPdfExtension(name)),
                fileName: ensurePdfExtension(fileName),
                url: buildFileUrl(ensurePdfExtension(fileName))
            };
        }

        function renderMatches(query) {
            if (!query) {
                hideMatches();
                return;
            }

            if (isLoadingNames) {
                resultsBox.hidden = false;
                resultsBox.innerHTML = '<div class="result empty">Loading names...</div>';
                return;
            }

            if (certificates.length === 0) {
                resultsBox.hidden = false;
                resultsBox.innerHTML = '<div class="result empty">Name list is not available. Enter your full name and click Download PDF.</div>';
                return;
            }

            const needle = query.toLowerCase();
            const matches = certificates
                .filter(function (certificate) { return certificate.name.toLowerCase().includes(needle); })
                    .sort(sortByNameDescending);

            if (matches.length === 0) {
                resultsBox.hidden = false;
                resultsBox.innerHTML = '<div class="result empty">No matching names found</div>';
                return;
            }

            resultsBox.innerHTML = matches.map(function (certificate) {
                return '<div class="result" role="option" data-name="' + escapeHtml(certificate.name) + '">' +
                    '<span class="result-name">' + escapeHtml(certificate.name) + '</span>' +
                    '<a class="download-link" href="' + certificate.url + '" download="' + escapeHtml(certificate.fileName) + '">Download PDF</a>' +
                    '</div>';
            }).join('');
            resultsBox.hidden = false;
        }

        function populateNameSuggestions() {
            suggestions.innerHTML = certificates.map(function (certificate) {
                return '<option value="' + escapeHtml(certificate.name) + '"></option>';
            }).join('');
        }

        resultsBox.addEventListener('click', function (event) {
            if (event.target.closest('.download-link')) {
                return;
            }

            const selected = event.target.closest('.result:not(.empty)');
            if (!selected) {
                return;
            }

            input.value = selected.dataset.name;
            hideMatches();
            input.focus();
        });

        function hideMatches() {
            resultsBox.hidden = true;
            resultsBox.innerHTML = '';
        }

        function findExactIndexMatch(name) {
            const needle = name.toLowerCase();
            return certificates.find(function (certificate) {
                return certificate.name.toLowerCase() === needle;
            });
        }

        async function findDirectPdf(name) {
            const candidates = uniqueValues([
                name,
                toTitleCase(name),
                name.toUpperCase(),
                name.toLowerCase()
            ]);

            for (const candidate of candidates) {
                const fileName = candidate + '.pdf';
                const url = buildFileUrl(fileName);
                if (await fileExists(url)) {
                    return { fileName: fileName, url: url };
                }
            }

            return null;
        }

        function buildFileUrl(fileName) {
            return folder + '/' + encodeURIComponent(fileName).replace(/%2F/gi, '/');
        }

        function getGitHubRepoInfo() {
            const host = window.location.hostname.toLowerCase();
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const repoParam = params.get('repo') || defaultGitHubRepo;
            let owner = '';
            let repo = '';

            if (host.endsWith('.github.io')) {
                owner = host.replace('.github.io', '');
                repo = owner + '.github.io';
            } else {
                const repoParts = repoParam.split('/');
                owner = repoParts[0] || '';
                repo = repoParts[1] || '';
            }

            if (host.endsWith('.github.io') && pathParts.length > 0 && pathParts[0].toLowerCase() !== 'certindex.html') {
                repo = pathParts[0];
            }

            return { owner: owner, repo: repo };
        }

        function getGitHubRepoApiUrl(repoInfo) {
            return 'https://api.github.com/repos/' +
                encodeURIComponent(repoInfo.owner) + '/' +
                encodeURIComponent(repoInfo.repo);
        }

        function getGitHubContentsApiUrl(repoInfo, branch) {
            return getGitHubRepoApiUrl(repoInfo) + '/contents/' +
                folder.split('/').map(encodeURIComponent).join('/') +
                '?ref=' + encodeURIComponent(branch);
        }

        function getGitHubTreeApiUrl(repoInfo, branch) {
            return getGitHubRepoApiUrl(repoInfo) + '/git/trees/' +
                encodeURIComponent(branch) + '?recursive=1';
        }

        function sortByNameDescending(first, second) {
            return second.name.localeCompare(first.name);
        }

        async function fileExists(url) {
            try {
                let response = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                if (response.ok) {
                    return true;
                }

                response = await fetch(url, { cache: 'no-store' });
                return response.ok;
            } catch (error) {
                console.error('Error checking PDF:', error);
                return false;
            }
        }

        function downloadPdf(url, fileName) {
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function cleanFolder(value) {
            return value
                .trim()
                .replace(/^\/+|\/+$/g, '')
                .split('/')
                .filter(function (part) {
                    return part && part !== '.' && part !== '..';
                })
                .map(encodeURIComponent)
                .join('/');
        }

        function normalizeSpaces(value) {
            return value.trim().replace(/\s+/g, ' ');
        }

        function toTitleCase(value) {
            return value.toLowerCase().replace(/\b[a-z]/g, function (letter) {
                return letter.toUpperCase();
            });
        }

        function uniqueValues(values) {
            return values.filter(function (value, index) {
                return values.indexOf(value) === index;
            });
        }

        function stripPdfExtension(value) {
            return String(value || '').replace(/\.pdf$/i, '');
        }

        function ensurePdfExtension(value) {
            const fileName = String(value || '').trim();
            return /\.pdf$/i.test(fileName) ? fileName : fileName + '.pdf';
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[character];
            });
        }

        function setStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'status' + (type ? ' ' + type : '');
        }
    </script>
</body>
</html>
